[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluent-blue"
version = "0.1.0"
description = "Modern Ant Design-styled design system for PyQt6 and PySide6"
readme = "CHANGELOG.md"
authors = [{ name = "Danieldev" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fluent_blue*"]
